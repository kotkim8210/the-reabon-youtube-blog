app = "rj-balju"
primary_region = "nrt"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  # 머신이 자동 정지되면 다음 요청 때 콜드스타트(~7초)가 발생하는데,
  # 그 사이 운송장 등록 같은 긴 POST를 누르면 요청이 머신에 닿지 못해
  # 프론트에 "Failed to fetch"로 보인다. 1대는 항상 켜둬서 콜드스타트를 없앤다.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[env]
  DATABASE_PATH = "/data/suyikolla.db"
  DEPLOYMENT_MODE = "saas"
  APP_BASE_URL = "https://rj-balju.fly.dev"
  # Toss billing API base; override for dev via fly secrets if needed
  TOSS_PAY_API_BASE = "https://api.tosspayments.com"
  # --- Secrets (set with `fly secrets set ...`):
  # TOSS_PAY_SECRET_KEY=...   (필수, Pro 결제 활성화)
  # TOSS_PAY_CLIENT_KEY=...   (필수, 프론트 빌링 위젯용)
  # JWT_SECRET=...            (권장)
  # KAKAO_CLIENT_ID=...       (카카오 로그인 - JavaScript 키)
  # GOOGLE_CLIENT_ID=...      (구글 로그인 - OAuth 2.0 클라이언트 ID)
  # ---

[mounts]
  source = "data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
